upstream_patch = ".github/patches/extensions/vss/0001-reset-storage.patch (DuckDB 1.5.6 source)"
distribution = "statically_linked"
sql_entrypoint = "LOAD vss"
integration = "crates/roastedduck/src/vss/mod.rs"
