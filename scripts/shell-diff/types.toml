# Lazy builtin type catalog, lookup scopes, spelling and rollback against C++ DuckDB.

[[case]]
name = "type-catalog-fresh-integr"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
SELECT 1::integr;
'''

[[case]]
name = "type-catalog-fresh-Integr"
args = ["-batch", "-csv", "-noheader"]
