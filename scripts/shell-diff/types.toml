[[case]]
name = "type-catalog-alter-client-fallback"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
CREATE TYPE my_enum AS ENUM ('x');
ATTACH ':memory:' AS c2;
CREATE SCHEMA c2.s1;
CREATE TYPE c2.my_enum AS ENUM ('y');
CREATE TABLE c2.s1.t(a VARCHAR);
INSERT INTO c2.s1.t VALUES ('x');
ALTER TABLE c2.s1.t ALTER COLUMN a SET DATA TYPE my_enum;
SELECT * FROM c2.s1.t;
'''

[[case]]
name = "type-catalog-create-client-fallback"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
CREATE TYPE my_enum AS ENUM ('x');
ATTACH ':memory:' AS c2;
CREATE SCHEMA c2.s1;
CREATE TYPE c2.my_enum AS ENUM ('y');
CREATE TABLE c2.s1.t(a my_enum);
INSERT INTO c2.s1.t VALUES ('x');
