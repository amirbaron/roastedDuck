SELECT 1::INTEGR;
'''

[[case]]
name = "type-catalog-checkpoint-reopen"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
.open type_catalog.db
CREATE TYPE mood AS ENUM ('a','b');
CREATE TABLE t(i INTEGER,m mood);
INSERT INTO t VALUES (1,'a');
CHECKPOINT;
.open :memory:
.open type_catalog.db
SELECT * FROM t;
SELECT database_name,type_name FROM duckdb_types() WHERE upper(type_name)='INTEGER' ORDER BY database_name,schema_name;
'''

[[case]]
name = "type-catalog-extension-error-order"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
SET autoinstall_known_extensions=false;
SET autoload_known_extensions=false;
SELECT 1::INET;
SELECT 1::"system".main."INTEGER";
SELECT 1::INTEGR;
'''

