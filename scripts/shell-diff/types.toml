[[case]]
name = "type-catalog-rollback-builtin"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
BEGIN;
SELECT 1::INTEGER;
ROLLBACK;
SELECT 1::INTEGR;
'''

[[case]]
name = "type-catalog-scope-builtin"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
CREATE SCHEMA s;
CREATE TYPE s.INTEGER AS ENUM ('a');
CREATE TABLE s.t(x INTEGER);
INSERT INTO s.t VALUES ('a');
SELECT count(*) FROM s.t;
'''

[[case]]
name = "type-catalog-scope-user"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
CREATE SCHEMA s;
CREATE TYPE s.my_enum AS ENUM ('a');
CREATE TABLE s.t(x my_enum);
INSERT INTO s.t VALUES ('a');
SELECT * FROM s.t;
'''

[[case]]
name = "type-catalog-schema-path"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
CREATE SCHEMA s;
CREATE TYPE s.INTEGER AS ENUM ('a');
SET schema='s';
CREATE TABLE t(x INTEGER);
INSERT INTO t VALUES ('a');
SELECT count(*) FROM t;
'''

[[case]]
name = "type-catalog-schema-hint"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
CREATE SCHEMA s;
CREATE TYPE s.magnitude_mojotypename AS ENUM ('a');
SET schema='s';
SELECT 1::magnitude_mojotypenam;
'''

[[case]]
name = "type-catalog-metadata-first-use"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
SELECT 1::INTEGER;
SELECT database_name,type_name,internal FROM duckdb_types() WHERE upper(type_name)='INTEGER' ORDER BY database_name,schema_name;
'''

[[case]]
name = "type-catalog-metadata-first-scan"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
SELECT count(*) FROM duckdb_types();
SELECT 1::INTEGER;
SELECT database_name,type_name,internal FROM duckdb_types() WHERE upper(type_name)='INTEGER' ORDER BY database_name,schema_name;
'''

[[case]]
name = "type-catalog-json-alias"
args = ["-batch", "-csv", "-noheader"]
stdin = '''
SELECT '{"a":1}'::JSON;
SELECT type_name,type_oid FROM duckdb_types() WHERE type_name='JSON';
SELECT 1::INTEGR;
'''

