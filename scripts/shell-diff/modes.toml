# Every output mode over values of every type.

[[case]]
name = "mode-{mode}-strings"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "jsonlines", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl", "trash", "ascii"] }
stdin = '''
.mode {mode}
SELECT * FROM (VALUES
  (1, NULL, 'null'),
  (2, '', 'empty'),
  (3, 'it''s', 'single quote'),
  (4, 'say "hi"', 'double quote'),
  (5, 'line1' || chr(10) || 'line2', 'newline'),
  (6, 'a' || chr(9) || 'b', 'tab'),
  (7, 'x' || chr(1) || chr(27) || chr(127) || 'y', 'control'),
  (8, '🦆 duck', 'emoji'),
  (9, '漢字テスト', 'cjk'),
  (10, 'e' || chr(769) || 'te', 'combining'),
  (11, 'back\slash', 'backslash'),
  (12, 'a,b;c|d', 'separators'),
  (13, '<b>&amp;</b>', 'html'),
  (14, '  padded  ', 'spaces'),
  (15, 'cr' || chr(13) || 'lf', 'carriage return'),
  (16, 'NULL', 'literal NULL text'),
  (17, '$x_{1}^2 % #', 'latex specials'),
  (18, '{brace} [b]', 'tcl specials')
) t(id, s, what) ORDER BY id;
'''

[[case]]
name = "mode-{mode}-long-string"
vary = { mode = ["duckbox", "box", "csv", "column", "json", "line", "list", "markdown", "table", "quote"] }
stdin = '''
.mode {mode}
SELECT repeat('abcdefghij', 30) AS long_value, 'short' AS s, repeat('漢', 70) AS wide;
'''

[[case]]
name = "mode-{mode}-numbers"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "jsonlines", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl", "ascii"] }
stdin = '''
.mode {mode}
SELECT -128::TINYINT AS ti, 127::TINYINT AS ti2, -32768::SMALLINT AS si, 2147483647::INTEGER AS i,
  -9223372036854775808::BIGINT AS bi, 170141183460469231731687303715884105727::HUGEINT AS hi,
  -170141183460469231731687303715884105728::HUGEINT AS hi2,
  340282366920938463463374607431768211455::UHUGEINT AS uhi, 255::UTINYINT AS uti,
  18446744073709551615::UBIGINT AS ubi;
SELECT 123.456::DECIMAL(18,3) AS d1, -0.001::DECIMAL(4,3) AS d2, 12345678901234567890.1234567890::DECIMAL(38,10) AS d3,
  1.5::DECIMAL(2,1) AS d4, 0::DECIMAL(10,2) AS d5, -99999.9999::DECIMAL(9,4) AS d6;
SELECT 0.1::DOUBLE AS a, 1/3 AS b, 3.141592653589793 AS c, 1e300 AS d, 1e-300 AS e, -0.0::DOUBLE AS f,
  'nan'::DOUBLE AS g, 'inf'::DOUBLE AS h, '-inf'::DOUBLE AS k, 123456789012345678.0 AS l,
  0.1::FLOAT AS m, 1.17549435e-38::FLOAT AS n, 3.4028235e38::FLOAT AS o, 'nan'::FLOAT AS p,
  2.5e-7::DOUBLE AS q, 1e15::DOUBLE AS r, 1e16::DOUBLE AS s, 123.0::DOUBLE AS t;
SELECT true AS t, false AS f, NULL::BOOLEAN AS n;
'''

[[case]]
name = "mode-{mode}-temporal"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "jsonlines", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl"] }
stdin = '''
SET TimeZone = 'America/New_York';
.mode {mode}
SELECT DATE '2024-02-29' AS d, DATE '0044-03-15 (BC)' AS bc, 'infinity'::DATE AS inf, '-infinity'::DATE AS ninf,
  TIME '23:59:59.999999' AS t, TIMETZ '12:34:56+05:30' AS ttz, TIMESTAMP '1970-01-01 00:00:00' AS ts,
  TIMESTAMP '2024-06-01 12:34:56.789' AS ts2, TIMESTAMPTZ '2024-06-01 12:34:56+00' AS tstz,
  TIMESTAMP_NS '2024-06-01 12:34:56.123456789' AS tsns, TIMESTAMP_MS '2024-06-01 12:34:56.123' AS tsms,
  TIMESTAMP_S '2024-06-01 12:34:56' AS tss, 'infinity'::TIMESTAMP AS tsinf;
SELECT INTERVAL 1 YEAR + INTERVAL 2 MONTH + INTERVAL 3 DAY + INTERVAL '04:05:06.789' AS i1,
  INTERVAL '-1 day' AS i2, INTERVAL 0 SECOND AS i3, to_microseconds(1) AS i4, INTERVAL 1000 HOUR AS i5;
'''

[[case]]
name = "mode-{mode}-misc-types"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "jsonlines", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl"] }
stdin = '''
CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
.mode {mode}
SELECT '\xAA\x00\xFFabc'::BLOB AS b, ''::BLOB AS eb, 'a''b'::BLOB AS qb,
  '00000000-0000-0000-0000-000000000000'::UUID AS u0, 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::UUID AS u,
  '10101'::BIT AS bits, 'happy'::mood AS m, NULL::mood AS nm;
'''

[[case]]
name = "mode-{mode}-nested"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "jsonlines", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl"] }
stdin = '''
.mode {mode}
SELECT [1, 2, NULL] AS l, [] AS el, ['a', 'it''s', NULL, '', 'x,y'] AS sl, {'a': 1, 'b': 'two', 'c': NULL} AS s,
  MAP {'k1': 1, 'k2': NULL} AS m, [1, 2, 3]::INTEGER[3] AS arr, union_value(num := 42)::UNION(num INT, str VARCHAR) AS u,
  [{'x': [1, 2], 'y': MAP {'z': [NULL]}}] AS deep, {'quote"key': 'v', 'sp ace': [1.5, 2.25]} AS weird_keys,
  [[]::INT[], [NULL::INT]] AS nested_empty, ['🦆', '漢字'] AS wide_list, {'': 1} AS empty_key,
  [DATE '2024-01-01', NULL] AS dates, {'b': '\x00'::BLOB} AS blob_struct, ['a' || chr(10) || 'b'] AS nl_list;
'''

[[case]]
name = "mode-{mode}-variant-geometry"
vary = { mode = ["duckbox", "box", "csv", "json", "jsonlines", "line", "list", "markdown", "quote", "insert", "html"] }
stdin = '''
.mode {mode}
SELECT 42::VARIANT AS v1, 'text'::VARIANT AS v2, {'a': [1, 2]}::VARIANT AS v3, NULL::VARIANT AS v4,
  [1.5, NULL]::VARIANT AS v5, DATE '2024-01-01'::VARIANT AS v6;
SELECT 'POINT(1 2)'::GEOMETRY AS g1, 'LINESTRING(0 0, 1 1, 2 1)'::GEOMETRY AS g2,
  'POLYGON((0 0, 1 0, 1 1, 0 0))'::GEOMETRY AS g3, 'POINT EMPTY'::GEOMETRY AS g4, NULL::GEOMETRY AS g5;
'''

[[case]]
name = "mode-{mode}-empty-result"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "jsonlines", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl", "ascii"] }
stdin = '''
.mode {mode}
SELECT 1 AS a, 'x' AS b WHERE false;
SELECT 42 AS only_column;
CREATE TABLE t(i INT);
INSERT INTO t VALUES (1), (2);
'''

[[case]]
name = "mode-{mode}-headers-off"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl"] }
stdin = '''
.headers off
.mode {mode}
SELECT 1 AS a, 'two' AS b, NULL AS c;
.headers on
SELECT 1 AS a, 'two' AS b, NULL AS c;
'''

