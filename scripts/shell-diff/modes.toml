[[case]]
name = "mode-insert-table-name"
stdin = '''
.mode insert my_table
SELECT 1 AS a, 'x' AS b;
.mode insert "quoted table"
SELECT 2 AS a;
.mode insert
SELECT 3 AS a;
.mode insert select
SELECT 4 AS a;
'''

[[case]]
name = "mode-invalid"
stdin = '''
.mode bogus
.mode
.mode csv extra
.mode
SELECT 1;
'''

[[case]]
name = "mode-show-current-{mode}"
vary = { mode = ["duckbox", "box", "csv", "column", "html", "insert", "json", "jsonlines", "latex", "line", "list", "markdown", "quote", "table", "tabs", "tcl", "trash", "ascii"] }
stdin = '''
.mode {mode}
.mode
.show
'''

[[case]]
name = "flag{flag}"
vary = { flag = ["-csv", "-json", "-markdown", "-box", "-line", "-list", "-html", "-ascii", "-column", "-table", "-quote", "-jsonlines"] }
args = ["{flag}"]
stdin = '''
SELECT 1 AS a, 'it''s' AS b, NULL AS c, [1, 2] AS d;
.mode
'''

[[case]]
name = "flag{flag}-c"
vary = { flag = ["-csv", "-json", "-markdown", "-box", "-line", "-list", "-html", "-ascii", "-column", "-table", "-quote", "-jsonlines"] }
args = ["{flag}", "-c", "SELECT 1 AS a, 'x y' AS b, NULL AS c"]

[[case]]
name = "flag-separator"
args = ["-list", "-separator", ";;", "-c", "SELECT 1 AS a, 2 AS b"]

[[case]]
name = "flag-separator-csv-order"
args = ["-separator", "\t", "-csv", "-c", "SELECT 1 AS a, 2 AS b"]

[[case]]
name = "flag-csv-separator-order"
args = ["-csv", "-separator", "\t", "-c", "SELECT 1 AS a, 2 AS b"]

[[case]]
name = "flag-nullvalue"
args = ["-list", "-nullvalue", "<null>", "-c", "SELECT NULL AS a, 1 AS b"]

[[case]]
name = "flag-nullvalue-duckbox"
args = ["-nullvalue", "∅", "-c", "SELECT NULL AS a, 1 AS b"]

[[case]]
name = "flag-header-list"
args = ["-list", "-header", "-c", "SELECT 1 AS a, 2 AS b"]

[[case]]
name = "flag-noheader-csv"
args = ["-csv", "-noheader", "-c", "SELECT 1 AS a, 2 AS b"]

[[case]]
name = "flag-noheader-duckbox"
args = ["-noheader", "-c", "SELECT 1 AS a, 2 AS b"]

[[case]]
name = "flag-newline"
args = ["-list", "-newline", "<EOL>", "-c", "SELECT * FROM range(3)"]

[[case]]
name = "flag-newline-csv"
args = ["-csv", "-newline", "\r\n", "-c", "SELECT * FROM range(3)"]

[[case]]
name = "separator-command"
stdin = '''
.mode list
.separator ,
SELECT 1 AS a, 2 AS b;
.separator | ~
SELECT 1 AS a, 2 AS b UNION ALL SELECT 3, 4;
.separator
.separator a b c
.mode csv
.separator ;
SELECT 1 AS a, 'x;y' AS b;
.mode tabs
SELECT 1 AS a, 'x	y' AS b;
'''

[[case]]
name = "separator-escapes"
stdin = '''
.mode list
.separator \t \n\n
SELECT 1 AS a, 2 AS b UNION ALL SELECT 3, 4;
.separator "\x41" \r\n
SELECT 1 AS a, 2 AS b;
'''

[[case]]
name = "csv-quoting"
stdin = '''
.mode csv
SELECT 'a b' AS x, ' lead' AS y, 'trail ' AS z, '"q"' AS q, 'semi;colon' AS s, '' AS e, NULL AS n, 'new
line' AS nl, '1,000' AS c;
.separator ;
SELECT 'a;b' AS x, 'a,b' AS y;
'''

[[case]]
name = "width-column-mode"
stdin = '''
.mode column
.width 5 -10 3
SELECT 1 AS a, 'right' AS b, 'truncated value' AS c, 'extra' AS d;
.width
SELECT 1 AS a, 'right' AS b;
.width 0 0
SELECT 'abc' AS a, 'abcdefgh' AS b;
'''

[[case]]
name = "width-table-box"
stdin = '''
.width 8 -8
.mode table
SELECT 'abc' AS a, 'def' AS b, 'long value here' AS c;
.mode box
SELECT 'abc' AS a, 'def' AS b, 'long value here' AS c;
.mode markdown
SELECT 'abc' AS a, 'def' AS b, 'long value here' AS c;
'''

[[case]]
name = "line-mode-alignment"
stdin = '''
.mode line
SELECT 1 AS a, 2 AS longer_name, 'multi
line' AS c;
SELECT * FROM range(3) t(i);
'''

[[case]]
name = "json-numbers-special"
stdin = '''
.mode json
SELECT 'nan'::DOUBLE AS a, 'inf'::DOUBLE AS b, 1e300 AS c, 12345678901234567890::HUGEINT AS d, 1.50::DECIMAL(5,2) AS e, true AS f;
.mode jsonlines
SELECT 'nan'::DOUBLE AS a, 'inf'::DOUBLE AS b, 1e300 AS c, 12345678901234567890::HUGEINT AS d, 1.50::DECIMAL(5,2) AS e, true AS f;
'''

[[case]]
name = "json-multiple-statements"
stdin = '''
.mode json
SELECT 1 AS a;
SELECT 2 AS b UNION ALL SELECT 3;
SELECT 1 WHERE false;
'''

[[case]]
name = "html-escaping"
stdin = '''
.mode html
SELECT '<>&"' || chr(39) AS "<col>", 'x' AS "a&b";
'''

[[case]]
name = "quote-mode-types"
stdin = '''
.mode quote
SELECT 1.5 AS d, 1.5::DOUBLE AS f, '\x00\x01'::BLOB AS b, DATE '2024-01-01' AS dt, true AS t, NULL AS n, [1] AS l;
'''

[[case]]
name = "insert-mode-types"
stdin = '''
.mode insert t
SELECT 1.5 AS d, 1.5::DOUBLE AS f, '\x00\x01'::BLOB AS b, DATE '2024-01-01' AS dt, true AS t, NULL AS n, [1] AS l, 'it''s' AS s, 'nan'::DOUBLE AS nan, 'inf'::DOUBLE AS inf;
'''

[[case]]
name = "binary-mode"
stdin = '''
.binary on
.mode list
SELECT '\xFF\x00a'::BLOB AS b;
.binary off
SELECT '\xFF\x00a'::BLOB AS b;
.binary
.binary maybe
'''

[[case]]
name = "trash-mode-errors"
stdin = '''
.mode trash
SELECT 1;
SELECT nonexistent;
SELECT 2;
'''

[[case]]
name = "tabs-mode-headers"
args = ["-header"]
stdin = '''
.mode tabs
SELECT 1 AS a, 'b	c' AS b;
'''

[[case]]
name = "ascii-mode-headers"
stdin = '''
.mode ascii
.headers on
SELECT 1 AS a, 2 AS b UNION ALL SELECT 3, 4;
'''
