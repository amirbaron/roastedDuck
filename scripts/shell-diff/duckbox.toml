'''

[[case]]
name = "duckbox-thousand-sep-columns"
stdin = '''
.thousand_sep ,
SELECT 1234567 AS a, 1234567.5 AS b, -1234 AS c, 999 AS d, 1234567::HUGEINT AS e, 12345.678::DECIMAL(10,3) AS f, 1234.5::FLOAT AS g;
