'''

[[case]]
name = "duckbox-many-rows-wide-values"
stdin = '''
SELECT i, repeat('x', i % 30) AS v, i * 1000000 AS big FROM range(100) t(i);
'''

[[case]]
name = "duckbox-null-variants"
stdin = '''
SELECT NULL AS a, NULL::INT AS b, [NULL] AS c, {'a': NULL} AS d, 'NULL' AS e, '' AS f;
.nullvalue NULL_TEXT
SELECT NULL AS a, NULL::INT AS b, [NULL] AS c;
.nullvalue ''
SELECT NULL AS a, NULL::INT AS b, [NULL] AS c;
'''

[[case]]
name = "duckbox-union-all-types"
stdin = '''
SELECT * FROM test_all_types();
'''

[[case]]
name = "duckbox-test-all-types-{mode}"
vary = { mode = ["csv", "json", "line", "list", "quote", "insert", "markdown", "box", "html", "jsonlines", "tabs", "tcl", "latex", "table", "column"] }
stdin = '''
.mode {mode}
SELECT * FROM test_all_types();
'''

[[case]]
name = "duckbox-test-all-types-columns"
stdin = '''
.columns
SELECT * FROM test_all_types();
'''

[[case]]
name = "duckbox-test-all-types-dump"
stdin = '''
CREATE TABLE t AS SELECT * EXCLUDE (varint, "union", fixed_int_array, fixed_varchar_array, fixed_nested_int_array, fixed_nested_varchar_array, fixed_struct_array, struct_of_fixed_array, fixed_array_of_int_list, list_of_fixed_int_array) FROM test_all_types();
.dump
'''

[[case]]
name = "duckbox-time-zones"
stdin = '''
SET TimeZone = 'Asia/Kolkata';
SELECT TIMESTAMPTZ '2024-03-10 12:00:00+00' AS a, TIMESTAMPTZ '1900-01-01 00:00:00+00' AS b, TIMETZ '12:00:00-08' AS c;
SET TimeZone = 'UTC';
SELECT TIMESTAMPTZ '2024-03-10 12:00:00+00' AS a;
SET TimeZone = 'America/St_Johns';
SELECT TIMESTAMPTZ '2024-07-01 12:00:00+00' AS a;
SET Calendar = 'japanese';
SELECT TIMESTAMPTZ '2024-07-01 12:00:00+00' AS a;
'''

[[case]]
name = "duckbox-pragma-database-size"
stdin = '''
PRAGMA database_size;
'''
normalize = [["│ \\d+\\.\\d+ [GMK]iB +│$", "│ MEM │"]]

[[case]]
name = "duckbox-memory-usage-of-last-result"
stdin = '''
SELECT memory_usage FROM pragma_database_size();
SELECT 42;
SELECT memory_usage FROM pragma_database_size();
SELECT * FROM range(100000);
SELECT memory_usage FROM pragma_database_size();
SELECT 'a' || range::VARCHAR || repeat('x', 20) AS s, [range, range + 1] AS l, {'a': range, 'b': 'str' || range} AS st FROM range(5000);
SELECT memory_usage FROM pragma_database_size();
SELECT tag, memory_usage_bytes FROM duckdb_memory() WHERE memory_usage_bytes > 0;
.mode csv
SELECT * FROM range(10);
SELECT memory_usage FROM pragma_database_size();
'''

[[case]]
name = "duckbox-settings"
stdin = '''
SELECT current_setting('max_memory') IS NOT NULL AS a;
SELECT name, value FROM duckdb_settings() WHERE name IN ('enable_progress_bar', 'enable_progress_bar_print', 'progress_bar_time', 'errors_as_json', 'max_expression_depth') ORDER BY name;
'''
