name: Release installation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.1.0-alpha.1
  release:
    types: [published]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            wheel: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            wheel: manylinux_2_28_aarch64
          - os: macos-26
            platform: macos-arm64
            wheel: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify
        env:
          PLATFORM: ${{ matrix.platform }}
          WHEEL: ${{ matrix.wheel }}
        run: |
          mkdir downloads sdk
          gh release download "$RELEASE_TAG" --dir downloads --pattern "roastedduck-*-$PLATFORM.tar.gz" --pattern "roastedduck-*-cp312-cp312-$WHEEL.whl" --pattern SHA256SUMS
          python scripts/release/verify_downloads.py downloads
          tar -xzf downloads/roastedduck-*-$PLATFORM.tar.gz -C sdk
      - name: Native CLI smoke
        run: |
          result=$(./sdk/bin/roastedDuck -csv -noheader -c 'SELECT sum(i) FROM range(10) t(i);')
          test "$result" = 45
      - name: Python install and persistence
        run: |
          python -m venv test-venv
          test-venv/bin/python -m pip install downloads/*.whl
          test-venv/bin/python scripts/release/smoke_python.py
