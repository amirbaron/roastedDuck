[package]
name = "rustdb-bench"
description = "Benchmark harness: runs DuckDB's benchmark suites on C++ DuckDB and rustdb and compares them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "bench-driver"
path = "src/bin/bench-driver.rs"

[dependencies]
rustdb.workspace = true
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
