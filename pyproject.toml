[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "roastedduck"
version = "1.5.6.post3"
requires-python = ">=3.10,<3.15"
description = "roastedDuck: an independent Rust SQL engine targeting DuckDB compatibility"
readme = "python/PYPI_README.md"
license = "MIT"
license-files = ["LICENSE", "python/LICENSE-UPSTREAM"]
authors = [{ name = "Amir Baron" }]
maintainers = [{ name = "roastedDuck contributors" }]
keywords = ["sql", "database", "analytics", "rust", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Documentation = "https://amirbaron.github.io/roastedDuck/"
Repository = "https://github.com/amirbaron/roastedDuck"
Issues = "https://github.com/amirbaron/roastedDuck/issues"

[tool.maturin]
sdist-generator = "git"
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "duckdb._duckdb"
features = ["extension-module"]
include = [
    { path = "third_party/**", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "_duckdb.py", format = "wheel" },
    { path = "_duckdb-stubs/**/*.pyi", format = "wheel" },
    { path = "adbc_driver_duckdb/**/*.py", format = "wheel" },
]
