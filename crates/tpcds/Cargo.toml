[package]
name = "roastedduck-tpcds"
description = "The TPC-DS extension: dsdgen, tpcds_queries, tpcds_answers and PRAGMA tpcds (DuckDB's extension/tpcds), on a port of the TPC's dsdgen."
version.workspace = true
edition.workspace = true
# dsdgen and its distributions are the TPC's; see README.md.
license-file = "LICENSE"
rust-version.workspace = true

[dependencies]
roastedduck-common.workspace = true
roastedduck-types.workspace = true
roastedduck-ast.workspace = true
roastedduck-planner.workspace = true
roastedduck-execution.workspace = true
roastedduck-catalog = { path = "../catalog" }
roastedduck-function = { path = "../function" }
roastedduck-storage = { path = "../storage" }

[lints]
workspace = true

[dev-dependencies]
roastedduck-buffer = { path = "../buffer" }
