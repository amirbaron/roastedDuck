[package]
name = "roastedduck-aws"
description = "Rust credential providers for roastedDuck's compatible AWS implementation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aws-config = { version = "=1.13.0", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "=1.3.1"
aws-runtime = "=1.10.2"
aws-smithy-http-client = { version = "=1.5.1", default-features = false, features = ["default-client", "rustls-ring", "rt-tokio"] }
aws-types = "=1.7.0"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

[lints]
workspace = true
