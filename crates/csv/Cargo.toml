[package]
name = "roastedduck-csv"
description = "The CSV reader and writer: sniffer, scanners, read_csv/sniff_csv and the COPY csv function (DuckDB's csv_scanner)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
roastedduck-common.workspace = true
roastedduck-types.workspace = true
roastedduck-ast.workspace = true
roastedduck-parser.workspace = true
roastedduck-planner.workspace = true
roastedduck-catalog = { path = "../catalog" }
roastedduck-function = { path = "../function" }
roastedduck-functions = { path = "../functions" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roastedduck-zstd = { path = "../zstd" }
unicode-normalization = "0.1"

[lints]
workspace = true

[dev-dependencies]
roastedduck-serde.workspace = true
