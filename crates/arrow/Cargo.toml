[package]
name = "roastedduck-arrow"
description = "The Arrow C data interface: DuckDB data chunks to and from Arrow arrays, and the arrow_scan table function (DuckDB's src/common/arrow and src/function/table/arrow*)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
roastedduck-common.workspace = true
roastedduck-types.workspace = true
roastedduck-planner.workspace = true
roastedduck-function = { path = "../function" }
roastedduck-storage = { path = "../storage" }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
roastedduck-serde.workspace = true
