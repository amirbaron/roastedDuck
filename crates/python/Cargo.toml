[package]
name = "roastedduck-python"
description = "Native Python bindings for the Rust DuckDB engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_duckdb"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "=0.30.1" }
roastedduck.workspace = true
roastedduck-common.workspace = true
roastedduck-types.workspace = true
roastedduck-ast.workspace = true
roastedduck-parser.workspace = true
roastedduck-planner.workspace = true
roastedduck-arrow = { path = "../arrow" }
roastedduck-function = { path = "../function" }
roastedduck-cli = { package = "roastedduck-cli", path = "../shell" }
roastedduck_capi = { package = "roastedduck-capi", path = "../capi" }

[lints]
workspace = true
