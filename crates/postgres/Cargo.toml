[package]
name = "roastedduck-postgres"
description = "Rust PostgreSQL wire backend for roastedDuck's compatible implementation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
roastedduck-common.workspace = true
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
percent-encoding = "2"
whoami = "2"

[lints]
workspace = true
