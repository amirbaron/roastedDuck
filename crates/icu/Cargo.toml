[package]
name = "roastedduck-icu"
description = "The ICU extension: time zones, calendars and TIMESTAMPTZ functions, and ICU collations (DuckDB's extension/icu), on ports of ICU 66's calendar code (over jiff) and collation runtime (over DuckDB's ICU 66 collation data)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
roastedduck-common.workspace = true
roastedduck-types.workspace = true
roastedduck-function = { path = "../function" }
roastedduck-functions = { path = "../functions" }
roastedduck-planner.workspace = true
roastedduck-serde.workspace = true
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }

[lints]
workspace = true
