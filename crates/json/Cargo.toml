[package]
name = "rustdb-json"
description = "The JSON extension: the JSON type and its casts, the json_* scalar functions, read_json and COPY ... (FORMAT json) (DuckDB's extension/json), on a port of yyjson."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rustdb-common.workspace = true
rustdb-types.workspace = true
rustdb-ast.workspace = true
rustdb-parser.workspace = true
rustdb-planner.workspace = true
rustdb-optimizer = { path = "../optimizer" }
rustdb-serde.workspace = true
rustdb-function = { path = "../function" }
rustdb-functions = { path = "../functions" }
rustdb-csv = { path = "../csv" }
zmij = "1.0.23"
memchr = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustdb-zstd = { path = "../zstd" }

[lints]
workspace = true
