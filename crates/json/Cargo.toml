[package]
name = "roastedduck-json"
description = "The JSON extension: the JSON type and its casts, the json_* scalar functions, read_json and COPY ... (FORMAT json) (DuckDB's extension/json), on a port of yyjson."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
roastedduck-common.workspace = true
roastedduck-types.workspace = true
roastedduck-ast.workspace = true
roastedduck-parser.workspace = true
roastedduck-planner.workspace = true
roastedduck-optimizer = { path = "../optimizer" }
roastedduck-serde.workspace = true
roastedduck-function = { path = "../function" }
roastedduck-functions = { path = "../functions" }
roastedduck-csv = { path = "../csv" }
zmij = "1.0.23"
memchr = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roastedduck-zstd = { path = "../zstd" }

[dev-dependencies]
roastedduck-catalog = { path = "../catalog" }

[lints]
workspace = true
