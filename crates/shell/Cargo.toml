[package]
name = "roastedduck-cli"
description = "The roastedDuck command-line shell with DuckDB-compatible SQL."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "roastedduck_cli"

[[bin]]
name = "roastedDuck"
path = "src/main.rs"

[dependencies]
roastedduck_capi = { package = "roastedduck-capi", path = "../capi" }
roastedduck.workspace = true
roastedduck-ast.workspace = true
roastedduck-common.workspace = true
roastedduck-parser.workspace = true
roastedduck-planner.workspace = true
roastedduck-types.workspace = true
roastedduck-function = { path = "../function" }
roastedduck-functions = { path = "../functions" }
roastedduck-serde.workspace = true
libc = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"

[lints]
workspace = true
